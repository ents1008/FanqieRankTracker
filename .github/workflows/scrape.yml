name: Daily Fanqie Rank Scraper

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-male-rank-writes-main
  cancel-in-progress: false

on:
  schedule:
    # 多时间窗口错峰轮询（一旦当日19分类完整，check_data会在3秒内自动跳过，零资源浪费）
    - cron: '17 0 * * *'   # 北京时间 08:17（早间主任务）
    - cron: '23 1 * * *'   # 北京时间 09:23（早间第1轮兜底）
    - cron: '47 2 * * *'   # 北京时间 10:47（上午第2轮兜底）
    - cron: '37 4 * * *'   # 北京时间 12:37（中午第3轮兜底）
    - cron: '19 6 * * *'   # 北京时间 14:19（下午第4轮兜底）
    - cron: '13 10 * * *'  # 北京时间 18:13（傍晚第5轮兜底）
  workflow_dispatch: # 允许手动在界面上点击 Run workflow

jobs:
  scrape-and-commit:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check if today's data exists
      id: check_data
      run: |
        IS_COMPLETE=$(python scripts/check_today_complete.py)
        if [ "$IS_COMPLETE" = "true" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ 今日全量数据已存在且19个分类完整，跳过爬取"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "📭 今日数据未抓取或分类不完整，将执行爬取/断点续爬"
        fi

    - name: Install Playwright Browsers
      if: steps.check_data.outputs.exists == 'false'
      run: playwright install --with-deps chromium

    - name: Run Scraper
      if: steps.check_data.outputs.exists == 'false'
      run: python scrape_fanqie_ranks.py
      env:
        GITHUB_ACTIONS: true
        FANQIE_CHANNEL: male

    - name: Build Latest Data with AI Summary
      run: pip install openai && python scripts/build_latest.py
      env:
        FANQIE_CHANNEL: male
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[Auto] Update Fanqie male ranks"
        file_pattern: data api
        branch: main

    # ---- Deploy to GitHub Pages (inline, 绕过 GITHUB_TOKEN 不触发其他 workflow 的限制) ----
    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: scrape-and-commit
    uses: ./.github/workflows/cloudflare-pages.yml
    secrets: inherit
